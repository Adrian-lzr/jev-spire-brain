name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Remove API keys, tokens, game saves, and private paths from all examples and logs.
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, CPython 3.12
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command or game screen where the problem occurs.
      placeholder: |
        1. Start ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error excerpt
      render: text
