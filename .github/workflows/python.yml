name: python

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pytest
      # Keep the checks separate so a failure in one layer cannot hide the
      # result of another. All inputs below are committed synthetic fixtures;
      # no provider, game installation or game configuration is used.
      - name: Python tests
        run: python -m pytest -q
      - name: Python compilation
        run: python -m compileall -q spirebrain start.py run_agent.py tools
      - name: Cross-language contract
        run: python tools/check_contracts.py
      - name: Offline metrics
        run: python -m spirebrain.analysis.metrics --input tests/fixtures/metrics/decision_trace.jsonl
      - name: Four-stack replay evaluation
        run: python -m spirebrain.analysis.evaluate --input tests/fixtures/replay/representative_states.json
      - name: Deterministic replay
        run: python -m spirebrain.analysis.replay --input tests/fixtures/replay/advisor_states.json
      - name: Launcher smoke (offline)
        run: python tools/auto_smoke.py
