name: python

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pytest
      # This runner executes tests, compilation, contracts, metrics and replay
      # independently, so a failure in one check cannot hide the others.
      # It uses only committed synthetic data and never calls a provider.
      - run: python tools/verify_offline.py
