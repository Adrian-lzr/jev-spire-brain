name: python

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest -q
      - run: python -m compileall -q spirebrain start.py run_agent.py
      - run: python tools/check_contracts.py
      - run: python -m spirebrain.analysis.metrics --input logs/decision_trace.jsonl
